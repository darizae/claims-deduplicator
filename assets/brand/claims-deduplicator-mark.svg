<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">Claims merged into one representative</title><desc id="desc">Three paraphrased sentences cluster by semantic similarity to yield a single representative claim.</desc>
<defs>
  <filter id="lift" x="-30%" y="-30%" width="170%" height="170%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#173E31" flood-opacity=".07"/></filter>
  <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 L8 5 L1 9" stroke="#23837D" stroke-width="2.1" fill="none" stroke-linecap="round" stroke-linejoin="round"/></marker>
 </defs>
<rect width="1200" height="600" fill="#E5EFEA"/>
<!-- three statements -->
<g filter="url(#lift)">
 <rect x="79" y="133" width="368" height="89" rx="18" fill="#FFFDF5" stroke="#B9D1C6" stroke-width="1.5"/>
 <rect x="79" y="255" width="368" height="89" rx="18" fill="#FFFDF5" stroke="#B9D1C6" stroke-width="1.5"/>
 <rect x="79" y="377" width="368" height="89" rx="18" fill="#FFFDF5" stroke="#B9D1C6" stroke-width="1.5"/>
</g>
<rect x="79" y="148" width="5" height="59" rx="2.5" fill="#23837D"/>
<rect x="79" y="270" width="5" height="59" rx="2.5" fill="#4A9EB1"/>
<rect x="79" y="392" width="5" height="59" rx="2.5" fill="#91BD5B"/>
<text x="109" y="187" fill="#173E31" font-family="Arial,sans-serif" font-size="25" font-weight="600">Sea levels are rising.</text>
<text x="109" y="309" fill="#173E31" font-family="Arial,sans-serif" font-size="24" font-weight="600">Sea level is increasing.</text>
<text x="109" y="431" fill="#173E31" font-family="Arial,sans-serif" font-size="24" font-weight="600">Ocean levels keep rising.</text>
<!-- incoming flows -->
<g stroke="#23837D" stroke-width="4" stroke-linecap="round" fill="none">
 <path d="M453 178 C502 178 509 235 545 278"/>
 <path d="M453 300 H540"/>
 <path d="M453 422 C502 422 509 364 545 321"/>
</g>
<!-- similarity grouping -->
<circle cx="616" cy="300" r="80" fill="#FFFDF5" stroke="#B4D2C7" stroke-width="2.5"/>
<g stroke="#23837D" stroke-width="4" fill="none" stroke-linecap="round"><path d="M585 278L617 253L646 280L634 335L589 330Z"/><path d="M617 253L634 335M585 278L634 335" stroke="#91BD5B" stroke-width="3"/></g>
<circle cx="585" cy="278" r="13" fill="#315E46"/><circle cx="617" cy="253" r="12" fill="#4A9EB1"/><circle cx="646" cy="280" r="14" fill="#5C9448"/><circle cx="634" cy="335" r="14" fill="#23837D"/><circle cx="589" cy="330" r="10" fill="#E6B84F"/>
<path d="M703 300H779" fill="none" stroke="#23837D" stroke-width="6" stroke-linecap="round" marker-end="url(#arr)"/>
<!-- single, selected claim -->
<rect x="808" y="208" width="338" height="186" rx="22" fill="#FFFDF5" stroke="#A3C7BA" stroke-width="1.8" filter="url(#lift)"/>
<rect x="840" y="237" width="66" height="31" rx="15.5" fill="#E1ECE4"/>
<text x="873" y="258" text-anchor="middle" fill="#315E46" font-family="Arial,sans-serif" font-size="17" font-weight="700">1 / 3</text>
<text x="844" y="321" fill="#173E31" font-family="Georgia,serif" font-size="36">Sea levels</text>
<text x="844" y="365" fill="#173E31" font-family="Georgia,serif" font-size="36">are rising.</text>
<circle cx="1107" cy="248" r="22" fill="#315E46"/>
<path d="M1097 248L1104 255L1118 240" stroke="#FFFDF5" stroke-width="4.3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>